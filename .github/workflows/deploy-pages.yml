name: Preview on GitHub Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install using existing Bun lockfile
        run: npx --yes bun@1.4.4 install --frozen-lockfile
      - run: npm run lint
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Test gallery scrolling on desktop and mobile
        run: |
          python3 -m venv "$RUNNER_TEMP/gallery-tests"
          "$RUNNER_TEMP/gallery-tests/bin/pip" install playwright==1.55.0
          GITHUB_PAGES=true npm run preview -- --port 4173 --strictPort &
          trap 'kill $!' EXIT
          export PREVIEW_URL=http://localhost:4173/aureabylnsite/
          curl --retry 15 --retry-all-errors --retry-delay 1 -fsS "$PREVIEW_URL" -o /dev/null
          "$RUNNER_TEMP/gallery-tests/bin/python" tests/gallery_scroll.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: editorial-desktop-mobile
          path: test-results/
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
