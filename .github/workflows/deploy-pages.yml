name: Preview on GitHub Pages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install using existing Bun lockfile
        run: npx --yes bun@1.4.4 install --frozen-lockfile
      - run: npx --yes bun@1.4.4 audit
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
      - name: Scan Git history and build for secrets
        run: |
          audit_dir="$(mktemp -d)"
          archive="$audit_dir/gitleaks.tar.gz"
          curl -fsSL --retry 3 -o "$archive" https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum -c -
          tar -xf "$archive" -C "$audit_dir" gitleaks
          "$audit_dir/gitleaks" git --log-opts=--all --redact=100 .
          "$audit_dir/gitleaks" dir --redact=100 dist
      - name: Test gallery scrolling on desktop and mobile
        run: |
          python3 -m venv "$RUNNER_TEMP/gallery-tests"
          "$RUNNER_TEMP/gallery-tests/bin/pip" install playwright==1.55.0
          GITHUB_PAGES=true npm run preview -- --port 4173 --strictPort &
          trap 'kill $!' EXIT
          export PREVIEW_URL=http://localhost:4173/aureabylnsite/
          curl --retry 15 --retry-all-errors --retry-delay 1 -fsS "$PREVIEW_URL" -o /dev/null
          "$RUNNER_TEMP/gallery-tests/bin/python" tests/gallery_scroll.py
          "$RUNNER_TEMP/gallery-tests/bin/python" tests/security_browser.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: editorial-desktop-mobile
          path: test-results/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
